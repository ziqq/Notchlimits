name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing tag version without the v prefix, e.g. 1.2.0'
        required: true
        type: string

permissions:
  contents: write
  actions: read
  checks: read

jobs:
  preflight:
    name: Validate release commit
    runs-on: macos-latest
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.verify.outputs.sha }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Load the release policy from protected main, not the triggering tag.
          ref: main
          fetch-depth: 0

      - name: Version and tag
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            TAG="v${VERSION}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Invalid semantic version."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release ${TAG} (version ${VERSION})"

      - name: Commit belongs to main and CI passed
        id: verify
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: bash scripts/verify_release.sh

  release:
    name: Build and publish release
    needs: preflight
    runs-on: macos-latest
    environment: release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          fetch-depth: 0

      - name: Import a.a.ustinoff certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          : "${CERTIFICATE_BASE64:?APPLE_SIGNING_CERTIFICATE_BASE64 is required}"
          : "${CERTIFICATE_PASSWORD:?APPLE_SIGNING_CERTIFICATE_PASSWORD is required}"
          KEYCHAIN="$RUNNER_TEMP/notchlimits-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          CERTIFICATE="$RUNNER_TEMP/notchlimits-signing.p12"
          trap 'rm -f "$CERTIFICATE"' EXIT
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          ISSUER="$RUNNER_TEMP/AppleWWDRCAG3.cer"
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$ISSUER"
          printf '%s  %s\n' dcf21878c77f4198e4b4614f03d696d89c66c66008d4244e1b99161aac91601f "$ISSUER" | shasum -a 256 -c -
          security import "$ISSUER" -k "$KEYCHAIN"
          security import "$CERTIFICATE" -P "$CERTIFICATE_PASSWORD" -k "$KEYCHAIN" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"

      - name: Build
        env:
          NOTCHLIMITS_VERSION: ${{ needs.preflight.outputs.version }}
          NOTCHLIMITS_BUILD_NUMBER: ${{ github.run_number }}
          NOTCHLIMITS_CODE_SIGN_IDENTITY: 2A1CD7C372968E01732ED7B26AC5CBB9F4014D33
        run: ./build.sh

      - name: Self-test
        run: NOTCHLIMITS_SELFTEST=1 ./build/Notchlimits.app/Contents/MacOS/Notchlimits

      - name: Bundle version matches tag
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          IN_BUNDLE=$(plutil -extract CFBundleShortVersionString raw build/Notchlimits.app/Contents/Info.plist)
          test "$IN_BUNDLE" = "$RELEASE_VERSION"

      - name: Package
        id: package
        env:
          NOTCHLIMITS_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          NAME="Notchlimits-${NOTCHLIMITS_VERSION}.zip"
          # ditto preserves the bundle signature and extended attributes.
          ditto -c -k --sequesterRsrc --keepParent build/Notchlimits.app "$NAME"

          # Sparkle installs the DMG; keep the ZIP for the previous updater.
          ./scripts/build_dmg.sh
          DMG="Notchlimits-${NOTCHLIMITS_VERSION}.dmg"
          mkdir -p build/sparkle
          cp "build/${DMG}" "build/sparkle/${DMG}"
          mv "build/${DMG}" "$DMG"

          shasum -a 256 "$DMG" "$NAME" > SHA256SUMS.txt
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "sha=$(shasum -a 256 "$NAME" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$NAME" | cut -f1 | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "dmg=${DMG}" >> "$GITHUB_OUTPUT"
          echo "dmg_sha=$(shasum -a 256 "$DMG" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "dmg_size=$(du -h "$DMG" | cut -f1 | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Sign update and appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          : "${SPARKLE_PRIVATE_KEY:?SPARKLE_PRIVATE_KEY is required}"
          # Include only the DMG in the appcast; retain the ZIP for migration.
          printf '%s' "$SPARKLE_PRIVATE_KEY" | .build/artifacts/sparkle/Sparkle/bin/generate_appcast \
            --ed-key-file - \
            --download-url-prefix "https://github.com/ziqq/Notchlimits/releases/download/$TAG/" \
            build/sparkle
          test -s build/sparkle/appcast.xml
          printf '%s' "$SPARKLE_PRIVATE_KEY" | python3 scripts/verify_update.py build/sparkle/appcast.xml

      - name: Release notes
        id: notes
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          TAG: ${{ needs.preflight.outputs.tag }}
          PACKAGE_DMG: ${{ steps.package.outputs.dmg }}
          PACKAGE_ZIP: ${{ steps.package.outputs.name }}
          DMG_SIZE: ${{ steps.package.outputs.dmg_size }}
          ZIP_SIZE: ${{ steps.package.outputs.size }}
          DMG_SHA: ${{ steps.package.outputs.dmg_sha }}
          ZIP_SHA: ${{ steps.package.outputs.sha }}
        run: |
          PREV=$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -1 || true)
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..HEAD"
            HEADING="Changes since ${PREV}"
          else
            RANGE=""
            HEADING="First release"
          fi

          # macOS paste cycles through delimiters; join with commas, then add spaces.
          LOCALES=$(find build/Notchlimits.app/Contents/Resources -maxdepth 1 -name '*.lproj' \
            -exec basename {} .lproj \; | sort | paste -sd ',' - | sed 's/,/, /g')

          {
            echo "Claude Code and Codex usage limits in a panel that slides out of the MacBook notch."
            echo
            echo "## Install"
            echo
            echo "Open **${PACKAGE_DMG}** and drag Notchlimits to Applications,"
            echo "then clear the quarantine flag and launch it:"
            echo
            echo '```bash'
            echo "xattr -dr com.apple.quarantine /Applications/Notchlimits.app"
            echo "open /Applications/Notchlimits.app"
            echo '```'
            echo
            echo "The build uses a stable Apple Development certificate for a.a.ustinoff."
            echo "It is not Developer ID notarized; clearing quarantine may still be needed on first install."
            echo
            echo "Without the DMG, from the archive:"
            echo
            echo '```bash'
            echo "unzip ${PACKAGE_ZIP}"
            echo "mv Notchlimits.app /Applications/"
            echo "xattr -dr com.apple.quarantine /Applications/Notchlimits.app"
            echo "open /Applications/Notchlimits.app"
            echo '```'
            echo
            echo "Check for Updates uses Sparkle, which verifies the signed appcast and update archive,"
            echo "installs the update and relaunches. Checks remain manual."
            echo "The .zip remains available for updating from versions with the previous installer."
            echo
            echo "The app runs in the background with no Dock icon. Hover over the notch or"
            echo "press ⌘P to open it; right-click the panel for settings and Quit."
            echo
            # Extract this version's CHANGELOG section up to the next heading.
            CHANGES=$(awk -v v="$RELEASE_VERSION" '
              $0 == "## " v || index($0, "## " v " ") == 1 { on = 1; next }
              on && /^## / { exit }
              on { print }
            ' CHANGELOG.md 2>/dev/null || true)
            if [ -n "$(printf '%s' "$CHANGES" | tr -d '[:space:]')" ]; then
              echo "## What's new"
              printf '%s\n' "$CHANGES"
              echo
            fi
            echo "## ${HEADING}"
            echo
            git log --no-merges --pretty='- %s (%h)' ${RANGE} | head -100
            echo
            echo "## Details"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Version | ${RELEASE_VERSION} |"
            echo "| Minimum macOS | 13.0 |"
            echo "| DMG size | ${DMG_SIZE} |"
            echo "| Archive size | ${ZIP_SIZE} |"
            echo "| UI languages | ${LOCALES} |"
            echo "| App signature | Apple Development: a.a.ustinoff |"
            echo "| Update signature | Sparkle Ed25519 |"
            echo
            echo "Self-test (parsers, JWT, formatting, localization completeness)"
            echo "passed on this build."
            echo
            echo "## Checksums"
            echo
            echo '```'
            echo "SHA-256  ${DMG_SHA}"
            echo "         ${PACKAGE_DMG}"
            echo "SHA-256  ${ZIP_SHA}"
            echo "         ${PACKAGE_ZIP}"
            echo '```'
          } > NOTES.md

          cat NOTES.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_SHA: ${{ needs.preflight.outputs.sha }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          PACKAGE_DMG: ${{ steps.package.outputs.dmg }}
          PACKAGE_ZIP: ${{ steps.package.outputs.name }}
        run: |
          # Recheck the remote tag immediately before publication.
          git fetch --quiet --no-tags origin "refs/tags/$RELEASE_TAG"
          if [ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$RELEASE_SHA" ]; then
            echo "::error::Remote tag $RELEASE_TAG does not match the build commit."
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            "$PACKAGE_DMG" \
            "$PACKAGE_ZIP" \
            build/sparkle/appcast.xml \
            SHA256SUMS.txt \
            --verify-tag \
            --title "Notchlimits $RELEASE_VERSION" \
            --notes-file NOTES.md

      - name: Remove temporary signing keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/notchlimits-signing.p12"
          if [ -f "$RUNNER_TEMP/notchlimits-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/notchlimits-signing.keychain-db"
          fi

  complete-issues:
    name: Complete issues after successful publication
    needs: [release]
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    concurrency:
      group: labels-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Apply semantic release transition
        uses: ziqq/actions/labeler@a991545704ba3fc43380d2b6024db3ca6935e4a7
        with:
          operation: release-completed
          github-token: ${{ github.token }}
          config-source: api
          allow-empty: 'true'
          allow-pattern-removal: 'true'
          max-targets: '100'

  notify:
    name: Notify release result
    needs: release
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout trusted notification template
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - name: Notify Discord and Telegram
        uses: ziqq/actions/notify@ccd1a799683cd461a45d9303ac6fcb2792f8f5d2
        with:
          providers: discord,telegram
          template-path: .github/notify/templates/release.md
          variables: |
            {
              "status_label": ${{ toJSON(needs.release.result) }}
            }
          failure-policy: required
          timeout-ms: "10000"
          max-attempts: "5"
          discord-webhooks: ${{ secrets.DISCORD_WEBHOOKS }}
          telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram-targets: ${{ secrets.TELEGRAM_TARGETS }}
