name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Проверки и сборка
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Окружение
        run: |
          swift --version
          sw_vers

      # Переводы держим сгенерированными: правка руками в .lproj потеряется
      # при следующем запуске генератора, поэтому ловим расхождение здесь.
      - name: Переводы совпадают с генератором
        run: |
          python3 Tools/make-strings.py
          if ! git diff --quiet -- Resources; then
            echo "::error::Resources/*.lproj разошлись с Tools/make-strings.py."
            echo "Запусти «python3 Tools/make-strings.py» и закоммить результат."
            git --no-pager diff --stat -- Resources
            exit 1
          fi

      - name: Синтаксис файлов локализации
        run: plutil -lint Resources/*.lproj/Localizable.strings

      - name: Генератор иконки работает
        run: |
          swift Tools/make-icon.swift
          test -s Resources/AppIcon.icns
          file Resources/AppIcon.icns | grep -q 'Mac OS X icon'

      - name: Сборка бандла
        run: ./build.sh

      # Оффлайн-проверки: парсеры, JWT, форматирование, полнота всех локализаций
      # и совпадение спецификаторов формата с английским.
      - name: Самопроверка
        run: NOTCHLIMITS_SELFTEST=1 ./build/NotchLimits.app/Contents/MacOS/NotchLimits

      - name: Бандл собран правильно
        run: |
          APP=build/NotchLimits.app
          plutil -lint "$APP/Contents/Info.plist"
          codesign --verify --deep --strict "$APP"
          test "$(plutil -extract LSUIElement raw "$APP/Contents/Info.plist")" = "true"
          test "$(plutil -extract CFBundleDisplayName raw "$APP/Contents/Info.plist")" = "Notch Limits"
          test -f "$APP/Contents/Resources/AppIcon.icns"
          LOCALES=$(find "$APP/Contents/Resources" -maxdepth 1 -name '*.lproj' | wc -l | tr -d ' ')
          echo "локализаций в бандле: $LOCALES"
          test "$LOCALES" -ge 14

      - name: Артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: NotchLimits-${{ github.sha }}
          path: build/NotchLimits.app
          if-no-files-found: error
          retention-days: 14

  notify:
    name: Notify CI result
    needs: build
    continue-on-error: true
    if: >-
      always() &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      NOTIFY_DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
      NOTIFY_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      NOTIFY_TELEGRAM_TARGETS: ${{ secrets.TELEGRAM_TARGETS }}
    steps:
      - name: Report missing notification secrets
        if: >-
          env.NOTIFY_DISCORD_WEBHOOKS == '' ||
          env.NOTIFY_TELEGRAM_BOT_TOKEN == '' ||
          env.NOTIFY_TELEGRAM_TARGETS == ''
        shell: bash
        run: >-
          echo "::warning::CI notification skipped because one or more notification secrets are not configured."

      - name: Checkout trusted notification template
        if: >-
          env.NOTIFY_DISCORD_WEBHOOKS != '' &&
          env.NOTIFY_TELEGRAM_BOT_TOKEN != '' &&
          env.NOTIFY_TELEGRAM_TARGETS != ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}

      - name: Notify Discord and Telegram
        if: >-
          env.NOTIFY_DISCORD_WEBHOOKS != '' &&
          env.NOTIFY_TELEGRAM_BOT_TOKEN != '' &&
          env.NOTIFY_TELEGRAM_TARGETS != '' &&
          hashFiles('.github/notify/templates/ci.md') != ''
        uses: ziqq/actions/notify@ccd1a799683cd461a45d9303ac6fcb2792f8f5d2
        with:
          providers: discord,telegram
          template-path: .github/notify/templates/ci.md
          variables: |
            {
              "pub_dev_url": "",
              "status_label": ${{ toJSON(needs.build.result) }}
            }
          failure-policy: best-effort
          timeout-ms: "10000"
          max-attempts: "5"
          discord-webhooks: ${{ env.NOTIFY_DISCORD_WEBHOOKS }}
          telegram-bot-token: ${{ env.NOTIFY_TELEGRAM_BOT_TOKEN }}
          telegram-targets: ${{ env.NOTIFY_TELEGRAM_TARGETS }}
